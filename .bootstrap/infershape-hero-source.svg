    <path d="M333 450h137" stroke="#b7c8ed" stroke-width="4"/><path d="m461 442 12 8-12 8" fill="#b7c8ed"/>
    <g transform="translate(490 424)"><circle cx="26" cy="26" r="25" fill="#eef2ff" stroke="#697bab" stroke-width="2"/><text x="18" y="34" font-size="20" font-weight="700" fill="#394b79">3</text><text x="0" y="88" font-size="17" font-weight="700" fill="#17264f">Diagnose</text><text x="0" y="112" font-size="12" fill="#566995">Loops, churn, scope escape, false done</text></g>
    <path d="M543 450h137" stroke="#b7c8ed" stroke-width="4"/><path d="m671 442 12 8-12 8" fill="#b7c8ed"/>
    <g transform="translate(700 424)"><circle cx="26" cy="26" r="25" fill="#eef2ff" stroke="#697bab" stroke-width="2"/><text x="18" y="34" font-size="20" font-weight="700" fill="#394b79">4</text><text x="0" y="88" font-size="17" font-weight="700" fill="#17264f">Repair</text><text x="0" y="112" font-size="12" fill="#566995">Exact next actions and verified facts</text></g>
  </g>

