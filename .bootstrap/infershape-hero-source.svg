  <text x="132" y="82" font-family="DejaVu Sans,Arial,sans-serif" font-size="58" font-weight="800" fill="#f8fafc">InferShape</text>
  <text x="132" y="129" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" fill="#c9d4f0">Coding-agent session intelligence for vibe coders.</text>
  <text x="132" y="168" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#dce5ff">See why the agent stalled. Resume from evidence. Stop false completion.</text>

  <!-- feature cards -->
  <g font-family="DejaVu Sans,Arial,sans-serif">
    <g transform="translate(44 204)"><rect width="330" height="90" rx="16" fill="#101a34" stroke="#35447f"/><circle cx="39" cy="45" r="20" fill="#18254b" stroke="#b7c6ff" stroke-width="2"/><text x="72" y="35" font-size="17" font-weight="700" fill="#f8fafc">Session Doctor</text><text x="72" y="61" font-size="13" fill="#aebce5">Repeated reads, loops and patch churn</text></g>
    <g transform="translate(404 204)"><rect width="330" height="90" rx="16" fill="#101a34" stroke="#35447f"/><circle cx="39" cy="45" r="20" fill="#18254b" stroke="#b7c6ff" stroke-width="2"/><path d="m31 45 6 6 12-15" fill="none" stroke="#a7b7ff" stroke-width="3"/><text x="72" y="35" font-size="17" font-weight="700" fill="#f8fafc">Proof-Aware</text><text x="72" y="61" font-size="13" fill="#aebce5">Flags done-before-verification claims</text></g>
    <g transform="translate(764 204)"><rect width="330" height="90" rx="16" fill="#101a34" stroke="#35447f"/><circle cx="39" cy="45" r="20" fill="#18254b" stroke="#b7c6ff" stroke-width="2"/><path d="M29 45h19m-7-7 8 7-8 7" fill="none" stroke="#a7b7ff" stroke-width="3"/><text x="72" y="35" font-size="17" font-weight="700" fill="#f8fafc">Repair Packet</text><text x="72" y="61" font-size="13" fill="#aebce5">Safe handoff to the next coding agent</text></g>
    <g transform="translate(1124 204)"><rect width="330" height="90" rx="16" fill="#101a34" stroke="#35447f"/><circle cx="39" cy="45" r="20" fill="#18254b" stroke="#b7c6ff" stroke-width="2"/><path d="M30 45h18M39 36v18" stroke="#a7b7ff" stroke-width="3"/><text x="72" y="35" font-size="17" font-weight="700" fill="#f8fafc">Local &amp; Private</text><text x="72" y="61" font-size="13" fill="#aebce5">No prompt, output or reasoning content</text></g>
  </g>

  <!-- report panel -->
  <g filter="url(#shadow)">
