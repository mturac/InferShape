name: Materialize PNG hero

on:
  push:
    branches: [feat/infershape-core]
    paths:
      - ".bootstrap/infershape-hero-source.svg"
      - ".github/workflows/materialize-hero.yml"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/infershape-core
          fetch-depth: 0
          persist-credentials: true

      - name: Render PNG from temporary vector source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/assets
          if command -v rsvg-convert >/dev/null 2>&1; then
            rsvg-convert --width 1536 --height 860 .bootstrap/infershape-hero-source.svg > docs/assets/infershape-hero.png
          elif command -v magick >/dev/null 2>&1; then
            magick -background none .bootstrap/infershape-hero-source.svg -resize 1536x860! -strip docs/assets/infershape-hero.png
          elif command -v convert >/dev/null 2>&1; then
            convert -background none .bootstrap/infershape-hero-source.svg -resize 1536x860! -strip docs/assets/infershape-hero.png
          else
            sudo apt-get update
            sudo apt-get install -y librsvg2-bin
            rsvg-convert --width 1536 --height 860 .bootstrap/infershape-hero-source.svg > docs/assets/infershape-hero.png
          fi

      - name: Validate generated PNG
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const bytes = await readFile('docs/assets/infershape-hero.png');
          const signature = Buffer.from([0x89,0x50,0x4e,0x47,0x0d,0x0a,0x1a,0x0a]);
          if (!bytes.subarray(0, 8).equals(signature)) throw new Error('Generated asset is not PNG.');
          const ihdr = bytes.indexOf(Buffer.from('IHDR'));
          if (ihdr < 0) throw new Error('Generated PNG has no IHDR.');
          const width = bytes.readUInt32BE(ihdr + 4);
          const height = bytes.readUInt32BE(ihdr + 8);
          if (width !== 1536 || height !== 860) throw new Error(`Expected 1536x860, got ${width}x${height}.`);
          if (bytes.length < 30000) throw new Error(`Generated PNG is unexpectedly small: ${bytes.length}.`);
          console.log(`Generated hero verified: ${width}x${height}, ${bytes.length} bytes.`);
          NODE

      - name: Remove one-shot bootstrap files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-source.yml
          rm -f .github/workflows/materialize-hero.yml

      - name: Commit PNG and cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: add verified PNG hero and remove bootstrap scaffolding"
          git push origin HEAD:feat/infershape-core
